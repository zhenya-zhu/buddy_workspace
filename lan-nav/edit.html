<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>编辑导航条目</title>
<style>
  :root { --bg:#f5f6f8; --surface:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#4f46e5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); }
  .wrap { width:min(1180px, 100% - 32px); margin-inline:auto; }
  header { background:#111827; color:#fff; padding:26px 0; border-radius:0 0 22px 22px; }
  h1 { margin:0; font-size:24px; letter-spacing:-.01em; }
  header p { margin:6px 0 0; color:rgba(255,255,255,.72); font-size:13px; }
  main { padding:24px 0 40px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  button { font:inherit; cursor:pointer; border-radius:9px; padding:9px 14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  button:hover { border-color:#cbd5e1; }
  .primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .primary:hover { background:#4338ca; }
  .status { color:var(--muted); font-size:13px; margin-left:auto; }
  .status.ok { color:#0f766e; } .status.err { color:#b91c1c; }
  .token { display:flex; align-items:center; gap:8px; font-size:13px; }
  .token input { width:170px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(16,24,40,.05); }
  .head, .row { display:grid; grid-template-columns:126px minmax(110px,1fr) minmax(190px,1.5fr) minmax(120px,1fr) 88px 58px; gap:8px; align-items:center; }
  .head { font-size:11px; color:var(--muted); padding:0 2px 8px; }
  .row { padding:8px 0; border-top:1px solid #f1f3f6; }
  input, select { width:100%; min-width:0; font:inherit; font-size:13px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 9px; outline:none; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(79,70,229,.12); }
  .del { padding:8px 0; color:#b91c1c; border-color:#fecaca; background:#fff5f5; font-size:12px; }
  .hint { margin:14px 2px 0; color:var(--muted); font-size:12px; }
  @media (max-width: 760px) {
    .head { display:none; }
    .row { grid-template-columns:1fr 1fr; gap:6px; }
    .row .url { grid-column:1 / -1; }
    .row .del { grid-column:1 / -1; }
    .status { margin-left:0; width:100%; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>编辑导航条目</h1>
    <p>在 Windows / 手机浏览器里改完保存，导航页 30 秒内自动更新 · <a style="color:#a5b4fc" href="index.html">返回导航页</a></p>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <button id="add" type="button">+ 新增条目</button>
    <button id="save" class="primary" type="button">保存到 Mac</button>
    <div id="tokenWrap" class="token" hidden>
      <label for="token">编辑口令</label>
      <input id="token" type="password" autocomplete="off" placeholder="输入口令">
    </div>
    <span id="status" class="status">正在读取条目…</span>
  </div>

  <div class="panel">
    <div class="head"><span>分组</span><span>名称</span><span>地址（固定内网 IP:端口）</span><span>备注</span><span>标签</span><span>操作</span></div>
    <div id="rows"></div>
  </div>
  <p class="hint">名称或地址为空的行会被忽略；地址需以 http:// 或 https:// 开头。分组：常用入口 / 正式版 / 测试版 / 实验项目。</p>
</main>

<script>
const GROUPS = [
  { id: 'basics', label: '常用入口' },
  { id: 'production', label: '正式版' },
  { id: 'testing', label: '测试版' },
  { id: 'lab', label: '实验项目' }
];
const rows = document.getElementById('rows');
const statusEl = document.getElementById('status');
const tokenInput = document.getElementById('token');
let needAuth = false;
tokenInput.value = localStorage.getItem('nav-edit-token') || '';

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
function addRow(item) {
  item = item || {};
  const options = GROUPS.map(g => `<option value="${g.id}"${g.id === item.group ? ' selected' : ''}>${g.label}</option>`).join('');
  rows.insertAdjacentHTML('beforeend', `<div class="row">
      <select class="group">${options}</select>
      <input class="name" type="text" value="${esc(item.name)}" placeholder="服务名称">
      <input class="url" type="text" value="${esc(item.url)}" placeholder="http://192.168.31.94:3000">
      <input class="desc" type="text" value="${esc(item.desc)}" placeholder="一句话说明">
      <input class="tag" type="text" value="${esc(item.tag)}" placeholder="标签">
      <button class="del" type="button">删除</button>
    </div>`);
}
function collect() {
  const data = [];
  for (const row of rows.querySelectorAll('.row')) {
    const name = row.querySelector('.name').value.trim();
    const url = row.querySelector('.url').value.trim();
    if (!name && !url) continue;
    if (!name || !url) throw new Error('有条目只填了名称或地址，请补全');
    if (!url.startsWith('http://') && !url.startsWith('https://')) throw new Error('地址必须以 http:// 或 https:// 开头：' + url);
    data.push({
      group: row.querySelector('.group').value,
      name: name,
      url: url,
      desc: row.querySelector('.desc').value.trim(),
      tag: row.querySelector('.tag').value.trim()
    });
  }
  return data;
}
async function load() {
  try {
    const response = await fetch('sites.json?t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    rows.innerHTML = '';
    data.forEach(addRow);
    if (!data.length) addRow();
    setStatus('已读取 ' + data.length + ' 条');
  } catch (error) {
    setStatus('读取失败：' + error.message, 'err');
  }
}
async function save() {
  try {
    const data = collect();
    const headers = { 'Content-Type': 'application/json' };
    if (needAuth) headers['X-Token'] = tokenInput.value.trim();
    localStorage.setItem('nav-edit-token', tokenInput.value.trim());
    const response = await fetch('api/sites', { method: 'POST', headers: headers, body: JSON.stringify(data) });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || ('HTTP ' + response.status));
    setStatus('已保存 ' + result.count + ' 条，导航页 30 秒内自动更新', 'ok');
  } catch (error) {
    setStatus('保存失败：' + error.message, 'err');
  }
}

document.getElementById('add').addEventListener('click', () => addRow({ group: 'production' }));
document.getElementById('save').addEventListener('click', save);
rows.addEventListener('click', event => {
  const button = event.target.closest('.del');
  if (button) button.closest('.row').remove();
});

(async function init() {
  try {
    const config = await fetch('api/config?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    needAuth = !!config.auth;
    document.getElementById('tokenWrap').hidden = !needAuth;
  } catch (_) { /* 老版本服务没有配置接口时按无口令处理 */ }
  await load();
})();
</script>
</body>
</html>
